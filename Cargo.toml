[package]
name = "stools"
version = "0.1.0"
edition = "2024"
description = "A minimal Fuzzel-style application launcher built with Slint"

[dependencies]
slint = { version = "1.11", default-features = false, features = [
    "backend-winit",
    "renderer-femtovg",
    "compat-1-2",
    "raw-window-handle-06",
] }
nucleo-matcher = "0.3"
pinyin = { version = "0.10", features = ["plain", "heteronym"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Read-only config parsing: `parse` only (serde comes via toml_edit's forced
# `serde` feature); the `display`/encoder half is never used by stools.
toml = { version = "0.8", default-features = false, features = ["parse"] }
bincode = "2.0"
dirs = "6.0"
# Same version Slint itself uses, so config font families can be checked
# against the installed system fonts without pulling in a second font stack.
fontique = "0.10"

# Linux-only dependencies
[target.'cfg(target_os = "linux")'.dependencies]

# Windows-only dependencies
[target.'cfg(windows)'.dependencies]
global-hotkey = "0.8"
tray-icon = "0.24"
muda = "0.19"
open = "5"
raw-window-handle = "0.6"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_Globalization",
] }
# Decodes the embedded tray bitmap (assets/icon.png) into the raw RGBA that
# tray_icon::Icon wants. `image` already sits in the tree via Slint, and PNG is
# the only format we handle, so this switches on a decoder rather than adds one.
image = { version = "0.25", default-features = false, features = ["png"] }

[build-dependencies]
slint-build = "1.11"
# Windows application icon (see build.rs). Deliberately not target-gated: a
# build script is compiled for the *host*, so it cannot `cfg(windows)` its way
# to the target — build.rs checks CARGO_CFG_TARGET_OS at runtime instead.
winresource = "0.1"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
